<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4f1" />
    <meta name="description" content="Release notes and updates for Fovelle." />
    <meta property="og:title" content="Fovelle Changelog" />
    <meta property="og:description" content="Release notes and updates for Fovelle." />
    <meta property="og:image" content="assets/fovelle-icon.png" />
    <title>Changelog — Fovelle</title>
    <link rel="icon" type="image/png" href="assets/fovelle-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body class="site-shell changelog-page">
    <div class="page-orb page-orb--top" aria-hidden="true"></div>
    <div class="page-orb page-orb--bottom" aria-hidden="true"></div>

    <header class="site-nav container">
      <a class="brand" href="index.html" aria-label="Fovelle home">
        <span class="brand-mark"><img src="assets/fovelle-icon.png" alt="" /></span>
        <span class="brand-name">Fovelle</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a class="nav-link nav-link--current" href="changelog.html" aria-current="page">Changelog</a>
        <a class="nav-link nav-link--github" href="https://github.com/inostarlin-passion/Fovelle" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main>
      <section class="releases-section container" aria-labelledby="releases-title">
        <div class="release-heading">
          <p class="eyebrow" id="releases-title">Updates</p>
          <span class="release-heading-line" aria-hidden="true"></span>
          <span class="release-heading-note">Latest first</span>
        </div>
        <div class="release-loading" data-release-loading role="status">Loading release history…</div>
        <div class="release-list" id="release-list" hidden></div>
        <div class="release-error" data-release-error hidden>
          We couldn’t load the release history right now. Please try again in a moment.
        </div>
      </section>

      <section class="changelog-footer-cta container">
        <p class="eyebrow">Ready when you are</p>
        <h2>Keep the focus<br /><em>on the image.</em></h2>
        <a class="text-cta" href="index.html#download-button">Download Fovelle <span aria-hidden="true">↓</span></a>
      </section>
    </main>

    <footer class="site-footer container">
      <div class="footer-brand">
        <span class="brand-mark brand-mark--small"><img src="assets/fovelle-icon.png" alt="" /></span>
        <span>Fovelle</span>
      </div>
      <p>Fast, minimal image viewing for macOS.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="https://github.com/inostarlin-passion/Fovelle" target="_blank" rel="noreferrer">GitHub ↗</a>
      </div>
    </footer>
  </body>
</html>
