releases:
  - version: "1.2.0"
    date: "2026-09-04"
    changes:
      - "Zoom images around the cursor position."
      - "Added a keyboard shortcut for “Toggle Fit and 100%”."
      - "Removed the deprecated context menu."
  - version: "1.1.0"
    date: "2026-09-01"
    changes:
      - "Hide the right navigation button when there is no next image, and the left navigation button when there is no previous image."
      - "Use locale-appropriate date and time formats for the “Modified” field in file information."
      - "Remove the rubber-banding effect when dragging images."
      - "Adjust keyboard shortcut settings."
      - "Fix an issue where the top of the vertical scrollbar was obscured by the title bar."
      - "Fix an issue where the horizontal and vertical scrollbars could not be scrolled all the way to the start or end."
      - "Fix an issue where the image and scrollbar positions could shift when a horizontal scrollbar appeared after zooming in."
      - "Fix an issue where scrolling to either end of the horizontal or vertical scrollbar could leave extra blank space in the viewport."
  - version: "1.0.5"
    date: "2026-08-31"
    changes:
      - "Fixed ghosting when dragging EPS or SVG images."
      - "Made the Settings window automatically resize to fit the content of each tab."
      - "Fixed an issue where preloading might not be enabled correctly."
  - version: "1.0.4"
    date: "2026-08-29"
    changes:
      - "Reduced app startup and exit times. Compared with qView as the baseline, startup time decreased from 433.306 ms to 327.359 ms, a 24.45% reduction, while exit time decreased from 77.171 ms to 37.406 ms, a 51.53% reduction."
  - version: "1.0.3"
    date: "2026-08-29"
    changes:
      - "Improved app launch and quit performance."
      - "Fixed an issue where the image position could change after entering or exiting full-screen mode."
  - version: "1.0.2"
    date: "2026-08-28"
    changes:
      - "Improved NEF image loading performance."
      - "Eliminated blurriness and jagged edges when dragging EPS or SVG images."
  - version: "1.0.1"
    date: "2026-08-27"
    changes:
      - "Refined the Settings UI."
      - "Removed some settings for a more focused experience."
  - version: "1.0.0"
    date: "2026-08-27"
    changes: []
